name: Evening Breakout Scanner

on:
  workflow_dispatch: # Can be triggered manually or via cron-job.org API

permissions:
  contents: write

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          pip install yfinance requests pandas tradingview-screener playwright playwright-stealth
          pip install --upgrade --no-cache-dir git+https://github.com/rongardF/tvdatafeed.git
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install Playwright Chromium Browser
        run: |
          playwright install --with-deps chromium

      - name: Run Evening Scanner
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_SECTOR_WEBHOOK: ${{ secrets.DISCORD_SECTOR_WEBHOOK }}
          TV_USERNAME: ${{ secrets.TV_USERNAME }}
          TV_PASSWORD: ${{ secrets.TV_PASSWORD }}
        run: python test.py

      - name: Commit and Push Watchlist
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add watchlist.json || true
          git commit -m "Update watchlist.json from evening scan" || echo "No changes to commit"
          git push
