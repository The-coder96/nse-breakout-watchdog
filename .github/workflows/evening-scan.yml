name: Evening Breakout Scanner

on:
  workflow_dispatch: # Triggerable manually via button or externally via cron-job.org API

permissions:
  contents: write

jobs:
  scan-market:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install yfinance requests pandas
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Evening Scanner
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python test.py

      - name: Commit and Push Watchlist
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add watchlist.json || true
          git commit -m "Scanner: Generated new watchlist.json for tomorrow" || echo "No changes to commit"
          git push
