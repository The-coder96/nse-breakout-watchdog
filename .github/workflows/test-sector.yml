name: Test Sector Breakout Scanner

on:
  workflow_dispatch: # Allows manual execution from the Actions tab

jobs:
  test-sector:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install yfinance pandas requests playwright
          playwright install chromium
          
      - name: Run Sector Scanner
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }} # Using standard webhook for the test
        run: python test_sector_breakout.py
