name: Test Sector Breakout Scanner

on:
  workflow_dispatch: # Allows manual execution ONLY. No automatic timer.

jobs:
  sector-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install pandas requests playwright tf-playwright-stealth
          pip install --upgrade --no-cache-dir git+https://github.com/rongardF/tvdatafeed.git
          playwright install chromium
          
      - name: Run Sector Scanner
        env:
          DISCORD_SECTOR_WEBHOOK: ${{ secrets.DISCORD_SECTOR_WEBHOOK }}
        run: python test_sector_breakout.py
