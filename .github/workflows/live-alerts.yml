name: Intraday Breakout Watchdog

on:
  workflow_dispatch: # Can be triggered manually or via cron-job.org API

permissions:
  contents: write

concurrency:
  group: watchlist-updater
  cancel-in-progress: false

jobs:
  check-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install yfinance requests pandas playwright
          pip install --upgrade --no-cache-dir git+https://github.com/rongardF/tvdatafeed.git

      - name: Install Playwright Chromium Browser
        run: |
          playwright install --with-deps chromium

      - name: Run Watchdog
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_SECTOR_WEBHOOK: ${{ secrets.DISCORD_SECTOR_WEBHOOK }}
          DISCORD_BUG_WEBHOOK: ${{ secrets.DISCORD_BUG_WEBHOOK }}
          TV_USERNAME: ${{ secrets.TV_USERNAME }}
          TV_PASSWORD: ${{ secrets.TV_PASSWORD }}
        run: python watchdog.py

      - name: Commit Watchlist Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add watchlist.json || true
          if git diff --staged --quiet; then
            echo "No changes to watchlist.json. Skipping commit and push."
          else
            git commit -m "Watchdog: Update watchlist after checks"
            git pull --rebase origin main
            git push
          fi
